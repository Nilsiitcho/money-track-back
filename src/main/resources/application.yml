spring:
  application:
    name: money-track
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moneytrack}
    username: ${SPRING_DATASOURCE_USERNAME:moneytrack}
    password: ${SPRING_DATASOURCE_PASSWORD:moneytrack}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  timezone: America/Sao_Paulo
  jwt:
    secret: ${APP_JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-bytes}
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:168}
  seed:
    username: ${APP_SEED_USER:admin}
    password: ${APP_SEED_PASSWORD:changeme}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  # Render (e outros PaaS) injetam a porta via env PORT; local usa 8080.
  port: ${PORT:8080}

---
spring:
  config:
    activate:
      on-profile: docker
